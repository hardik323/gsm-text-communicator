<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta id="timeout-minutes" name="timeout-minutes" content="15" />
<title>GeoPulse · Request Dashboard</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b1220;
      --card: #111a2e;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --line: #1e293b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px; }

  header { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(37, 99, 235, .15); }
  h1 { font-size: 20px; margin: 0; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .actions { display: flex; align-items: center; gap: 10px; }
  .live { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .live.on { color: #059669; }
  .live.off { color: #dc2626; }
  .updated { font-size: 12px; color: var(--muted); }
  button {
    cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 6px 12px; font-size: 13px;
  }
  button:hover { border-color: var(--accent); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .stat b { display: block; font-size: 26px; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  .chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .chip i { font-style: normal; opacity: .75; margin-left: 4px; }
  input[type="search"] {
    margin-left: auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; min-width: 220px;
  }

  .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left; color: var(--muted); font-weight: 600; font-size: 11px;
    text-transform: uppercase; letter-spacing: .05em; padding: 10px 12px;
    border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
  .muted { color: var(--muted); }
  .ago { font-size: 11px; color: var(--muted); }

  .login-card {
    position: absolute; right: 20px; top: 64px; width: 220px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.08);
  }
  .login-card form { display: flex; flex-direction: column; gap: 6px; }
  .login-card input { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
  .login-msg { font-size: 12px; margin: 6px 0 0; color: var(--ink); }
  .login-msg.ok { color: #059669; }
  .login-msg.err { color: #dc2626; }

  .admin-card {
    margin-top: 14px; padding: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px;
  }
  .admin-card h2 { margin: 0 0 8px; font-size: 14px; }
  .admin-card label { display: block; font-size: 12px; margin-bottom: 8px; }
  .admin-card label input { margin-left: 6px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; font-size: 12px; }
  .admin-card button { margin-top: 4px; }
  .admin-msg { font-size: 12px; margin: 8px 0 0; }
  .admin-msg.ok { color: #059669; }
  .admin-msg.err { color: #dc2626; }

  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .timeout { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-variant-numeric: tabular-nums; }
  .timeout-bar { display: inline-block; width: 48px; height: 6px; border-radius: 999px; background: #e2e8f0; overflow: hidden; vertical-align: middle; }
  .timeout-bar + span { font-weight: 600; }
  .timeout-bar { background: linear-gradient(90deg, #22c55e, #eab308 60%, #ef4444); }
  .s1 { background: #fef3c7; color: #92400e; }
  .s2 { background: #ede9fe; color: #5b21b6; }
  .s3 { background: #d1fae5; color: #065f46; }
  .s4 { background: #fee2e2; color: #991b1b; }
  .s5 { background: #e0f2fe; color: #075985; }
  .s6 { background: #bbf7d0; color: #14532d; }
  .s7 { background: #fecaca; color: #7f1d1d; }
  .s8 { background: #e7e5e4; color: #292524; }
  .s0 { background: #e2e8f0; color: #475569; }
  @media (prefers-color-scheme: dark) { .s0 { background: #334155; color: #cbd5e1; } }

  tr.flash { animation: flash 1.6s ease-out; }
  @keyframes flash { from { background: rgba(37, 99, 235, .14); } to { background: transparent; } }
  tr.blink1 { animation: blinkPulse 200ms ease-out; }
  tr.blink2 { animation: blinkPulse 200ms ease-out 220ms; }
  @keyframes blinkPulse {
    0% { background: rgba(37, 99, 235, .28); }
    100% { background: transparent; }
  }
  .empty { padding: 36px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>GeoPulse</h1>
        <p>Location request dashboard · reads live from the database</p>
      </div>
    </div>
    <div class="actions">
      <span id="live" class="live on">● Live</span>
      <span id="updated" class="updated"></span>
      <button id="manualRefresh" type="button">Refresh now</button>
      <button id="loginBtn" type="button" style="display:none">Log in</button>
      <button id="logoutBtn" type="button" style="display:none">Log out</button>
    </div>
    <div id="loginCard" class="login-card" hidden>
      <form id="loginForm">
        <input id="loginUser" type="text" placeholder="Username" required />
        <input id="loginPass" type="password" placeholder="Password" required />
        <button type="submit">Sign in</button>
      </form>
      <p id="loginMsg" class="login-msg" hidden></p>
    </div>
    <div id="adminCard" class="admin-card" hidden>
      <h2>Admin</h2>
      <label>
        Change password for
        <input id="adminUser" type="text" placeholder="username" />
      </label>
      <label>
        Current password
        <input id="adminCur" type="password" />
      </label>
      <label>
        New password
        <input id="adminNew" type="password" />
      </label>
      <button id="adminChange" type="button">Change password</button>
      <p id="adminMsg" class="admin-msg" hidden></p>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="toolbar">
    <div class="chips" id="chips"></div>
    <input id="search" type="search" placeholder="Search number, id, user…" />
  </section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Created (local)</th>
          <th>Query number</th>
          <th>User</th>
          <th>Chat</th>
          <th>TSP</th>
          <th>Nodal response</th>
          <th>Time to timeout</th>
          <th>Status</th>
          <th>Updated (local)</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div id="empty" class="empty" hidden>
      No requests yet — send <code>/location {mobile number}</code> to the bot.
    </div>
  </section>
</div>

<script>
const STATUS_ORDER = [1, 2, 3, 4, 5, 6, 7, 8];
const OPEN = [1, 2, 5];
const DONE = [3, 6];
const FAILED = [4, 7, 8];

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

const STATUS_REASON = {
  1: 'Accepted from Telegram. The background worker is picking it up.',
  2: 'Handed to the telecom operator lookup. Waiting for the carrier to be identified.',
  3: 'Carrier identified. The lookup SMS is being prepared.',
  4: 'Carrier could not be identified. No lookup SMS was sent.',
  5: 'Lookup SMS sent to the carrier. Waiting for the nodal reply.',
  6: 'Nodal reply received. The location information is attached to this request.',
  7: 'No nodal reply arrived within the timeout window.',
  8: 'Processing failed. The request could not be completed.',
};

function statusReason(r) {
  const text = STATUS_REASON[r.Status];
  if (!text) return '';
  const parts = [text];
  if (r.Status === 7) {
    parts.push('No reply within ' + timeoutLabel(NODAL_TIMEOUT_MS) + '.');
  }
  if (r.Status === 8) {
    if (r.Comments) parts.push('Notes: ' + esc(r.Comments));
    else parts.push('Check the server logs for details.');
  }
  if (r.Status === 6 && r.NodalResponse) {
    parts.push('Location reply:\n' + esc(r.NodalResponse));
  }
  return parts.join(' ');
}

function timeoutLabel(ms) {
  const m = Math.round(ms / 60000);
  return m + ' minute' + (m === 1 ? '' : 's');
}

function badge(r) {
  const cls = STATUS_ORDER.includes(r.Status) ? 's' + r.Status : 's0';
  const title = statusReason(r);
  const safeTitle = esc(title);
  return '<span class="badge ' + cls + '"' + (safeTitle ? ' title="' + safeTitle + '"' : '') + '>' + esc(r.StatusName) + ' · ' + r.Status + '</span>';
}

const NODAL_TIMEOUT_MS = (function () {
  try {
    return Number(document.querySelector('meta[name=timeout-minutes]').content) * 60 * 1000 || 15 * 60 * 1000;
  } catch (e) {
    return 15 * 60 * 1000;
  }
})();

function timeoutFor(r) {
  if (!OPEN.includes(r.Status)) return '—';
  const last = r.LastStatusChangeDateTime;
  if (!last) return '—';
  const remaining = NODAL_TIMEOUT_MS - (Date.now() - new Date(last).getTime());
  if (remaining <= 0) return '<span class="muted">expired</span>';
  const total = NODAL_TIMEOUT_MS;
  const pct = Math.min(100, Math.max(0, (remaining / total) * 100));
  const bar = '<span class="timeout-bar" style="width:' + pct + '%"></span>';
  const secs = Math.max(0, Math.floor(remaining / 1000));
  const label = secs < 60
    ? secs + 's'
    : secs < 3600
      ? Math.floor(secs / 60) + 'm ' + (secs % 60) + 's'
      : Math.floor(secs / 3600) + 'h ' + Math.floor((secs % 3600) / 60) + 'm';
  return '<span class="timeout">' + bar + label + '</span>';
}

const sum = (list) => list.reduce((n, s) => n + (state.counts[s] || 0), 0);

function fmtLocal(iso) {
  return iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'medium' }) : '—';
}

function timeAgo(iso) {
  const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return Math.floor(s) + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

const $ = function (id) { return document.getElementById(id); };

const state = {
  total: 0,
  counts: {},
  requests: [],
  filter: 'all',
  search: '',
  previous: new Map(),
};

function render() {
  $('stats').innerHTML = [
    ['Total requests', state.total],
    ['Open', sum(OPEN)],
    ['Located', sum(DONE)],
    ['Failed', sum(FAILED)],
  ].map(function (item) { return '<div class="stat"><span>' + item[0] + '</span><b>' + item[1] + '</b></div>'; }).join('');

  var chip = function (value, label, count) {
    return '<span class="chip' + (state.filter === value ? ' active' : '') + '" data-filter="' + value + '">' + label + '<i>' + count + '</i></span>';
  };
  $('chips').innerHTML =
    chip('all', 'All', state.total) +
    STATUS_ORDER.map(function (s) { return chip(String(s), s, state.counts[s] || 0); }).join('');
  var chips = document.querySelectorAll('#chips .chip');
  for (var i = 0; i < chips.length; i++) {
    (function (el) {
      el.addEventListener('click', function () {
        state.filter = el.dataset.filter;
        render();
      });
    })(chips[i]);
  }

  var q = state.search.trim().toLowerCase();
  var visible = state.requests.filter(function (r) {
    if (state.filter !== 'all' && String(r.Status) !== state.filter) return false;
    if (!q) return true;
    return [r.QueryNumber, r.Id, r.UserId, r.ChatId].join(' ').toLowerCase().indexOf(q) !== -1;
  });

  $('rows').innerHTML = visible.map(function (r) {
    var changed = state.previous.get(r.Id) !== r.Status;
    return '<tr class="' + (changed ? 'flash' : '') + '" data-changed="' + (changed ? '1' : '0') + '" title="' + esc(r.Id) + '">' +
      '<td title="UTC ' + esc(r.CreatedDateTime) + '"><div>' + esc(fmtLocal(r.CreatedDateTime)) + '</div><div class="ago">' + esc(timeAgo(r.CreatedDateTime)) + '</div></td>' +
      '<td class="mono">' + esc(r.QueryNumber) + '</td>' +
      '<td class="mono muted">' + esc(r.UserId) + '</td>' +
      '<td class="mono muted">' + esc(r.ChatId) + '</td>' +
      '<td>' + esc(r.TSP || '—') + '</td>' +
      '<td class="mono muted">' + esc(r.NodalResponse || '—') + '</td>' +
      '<td>' + timeoutFor(r) + '</td>' +
      '<td>' + badge(r) + '</td>' +
      '<td title="UTC ' + esc(r.LastStatusChangeDateTime) + '"><div>' + esc(fmtLocal(r.LastStatusChangeDateTime)) + '</div><div class="ago">' + esc(timeAgo(r.LastStatusChangeDateTime)) + '</div></td>' +
      '</tr>';
  }).join('');

  var changedRows = document.querySelectorAll('#rows tr[data-changed="1"]');
  for (var j = 0; j < changedRows.length; j++) {
    (function (row) {
      if (row._blinkTimer) clearTimeout(row._blinkTimer);
      row.classList.remove('blink1', 'blink2');
      void row.offsetWidth;
      row.classList.add('blink1');
      row._blinkTimer = setTimeout(function () {
        row.classList.remove('blink1');
        void row.offsetWidth;
        row.classList.add('blink2');
        row._blinkTimer = setTimeout(function () {
          row.classList.remove('blink2');
          row._blinkTimer = null;
        }, 220);
      }, 220);
    })(changedRows[j]);
  }

  $('empty').hidden = visible.length > 0;
  state.previous = new Map(state.requests.map(function (r) { return [r.Id, r.Status]; }));
  $('updated').textContent = 'updated ' + new Date().toLocaleTimeString();
}

function apply(data) {
  if (!data || !Array.isArray(data.requests)) return;
  state.total = data.total;
  state.counts = data.counts;
  state.requests = data.requests;
  render();
}

function setLive(on) {
  $('live').textContent = on ? '● Live' : '● Reconnecting…';
  $('live').className = 'live ' + (on ? 'on' : 'off');
}

function connect() {
  var es = new EventSource('/api/stream');
  var events = ['snapshot', 'update'];
  for (var i = 0; i < events.length; i++) {
    (function (event) {
      es.addEventListener(event, function (e) {
        apply(JSON.parse(e.data));
        setLive(true);
      });
    })(events[i]);
  }
  es.onerror = function () { setLive(false); };
}

$('search').addEventListener('input', function (e) {
  state.search = e.target.value;
  render();
});

$('manualRefresh').addEventListener('click', function () {
  fetch('/api/snapshot').then(function (r) { return r.json(); }).then(function (data) {
    apply(data);
  }).catch(function () { setLive(false); });
});

(function () {
  var LOGIN_URL = '/api/login';
  var LOGOUT_URL = '/api/logout';
  var SESSION_URL = '/api/session';
  var PASSWORD_URL = '/api/password';

  var session = null;

  function refreshSession() {
    fetch(SESSION_URL).then(function (r) { return r.json(); }).then(function (data) {
      session = data.username ? { username: data.username, role: data.role } : null;
    }).catch(function () { session = null; }).then(applySessionUI);
  }

  function applySessionUI() {
    var isAdmin = session && session.role === 'admin';
    $('loginCard').hidden = !!session;
    $('loginBtn').style.display = session ? 'none' : '';
    $('logoutBtn').style.display = session ? '' : 'none';
    $('adminCard').hidden = !isAdmin;
    if (session && !isAdmin) {
      $('adminCard').innerHTML = '<p class="admin-msg err">Only admins can change passwords.</p>';
    } else {
      $('adminCard').innerHTML =
        '<h2>Admin</h2>' +
        '<label>Change password for <input id="adminUser" type="text" placeholder="username" /></label>' +
        '<label>Current password <input id="adminCur" type="password" /></label>' +
        '<label>New password <input id="adminNew" type="password" /></label>' +
        '<button id="adminChange" type="button">Change password</button>' +
        '<p id="adminMsg" class="admin-msg" hidden></p>';
    }
  }

  $('loginBtn').addEventListener('click', function () {
    $('loginCard').hidden = false;
    $('loginUser').focus();
  });

  $('logoutBtn').addEventListener('click', function () {
    fetch(LOGOUT_URL, { method: 'POST' }).then(function () {
      session = null;
      refreshSession();
      window.location.reload();
    });
  });

  $('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var user = $('loginUser').value.trim();
    var pass = $('loginPass').value;
    $('loginMsg').hidden = false;
    $('loginMsg').className = 'login-msg';
    $('loginMsg').textContent = 'Signing in…';
    fetch(LOGIN_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ username: user, password: pass }),
    }).then(function (res) { return res.json(); }).then(function (data) {
      if (!res.ok) {
        $('loginMsg').className = 'login-msg err';
        $('loginMsg').textContent = data.error || 'Sign in failed';
        return;
      }
      session = { username: data.username, role: data.role };
      $('loginCard').hidden = true;
      $('loginMsg').className = 'login-msg ok';
      $('loginMsg').textContent = 'Signed in as ' + data.username;
      setTimeout(refreshSession, 400);
    }).catch(function () {
      $('loginMsg').className = 'login-msg err';
      $('loginMsg').textContent = 'Network error';
    });
  });

  $('adminChange').addEventListener('click', function () {
    var user = $('adminUser').value.trim();
    var cur = $('adminCur').value;
    var next = $('adminNew').value;
    $('adminMsg').hidden = false;
    $('adminMsg').className = 'admin-msg';
    $('adminMsg').textContent = 'Changing…';
    fetch(PASSWORD_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, currentPassword: cur, newPassword: next }),
    }).then(function (res) { return res.json(); }).then(function (data) {
      if (!res.ok) {
        $('adminMsg').className = 'admin-msg err';
        $('adminMsg').textContent = data.error || 'Could not change password';
        return;
      }
      $('adminMsg').className = 'admin-msg ok';
      $('adminMsg').textContent = 'Password changed for ' + user;
      $('adminCur').value = '';
      $('adminNew').value = '';
    }).catch(function () {
      $('adminMsg').className = 'admin-msg err';
      $('adminMsg').textContent = 'Network error';
    });
  });

  refreshSession();
  setInterval(refreshSession, 30000);
})();

setInterval(render, 30000);

connect();
</script>
</body>
</html>
